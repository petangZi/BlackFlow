<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="description" content="Black Flow - Platform AI multi-model dengan failover otomatis dan API registry">
  <title>Black Flow</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="app" id="app">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Navigasi utama">
      <div class="sb-top">
        <button class="icon-btn only-desktop" id="sbToggle" title="Tutup sidebar" aria-label="Tutup sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M9 3v18"/>
          </svg>
        </button>
        <button class="icon-btn only-mobile" id="sbClose" title="Tutup" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
        <button class="icon-btn" id="sbNew" title="Chat baru" aria-label="Chat baru">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>
          </svg>
        </button>
      </div>

      <div class="sb-scroll">
        <button class="sb-item" id="sbSearch">
          <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          <span class="sb-label">Cari chat</span>
        </button>

        <div class="sb-group">
          <div class="sb-group-title">Chat</div>
          <button class="sb-item" data-view="chat">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
            <span class="sb-label">Semua Chat</span>
          </button>
        </div>

        <div class="sb-group">
          <div class="sb-group-title">Dashboard</div>
          <button class="sb-item" data-view="dashboard-overview">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="12" x="14" y="12" rx="1"/><rect width="7" height="9" x="3" y="16" rx="1"/></svg></span>
            <span class="sb-label">Overview</span>
          </button>
          <button class="sb-item" data-view="dashboard-usage">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg></span>
            <span class="sb-label">Usage & Logs</span>
          </button>
          <button class="sb-item" data-view="dashboard-keys">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M6 11h12"/><path d="M10 16h8"/></svg></span>
            <span class="sb-label">API Keys</span>
          </button>
          <button class="sb-item" data-view="dashboard-byok">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 21H8a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1.9"/><path d="M16 7h5"/><path d="M18.5 5V3"/><path d="M21.7 10.3 18.3 7"/><path d="M22 10v7a2 2 0 0 1-2 2h-.3"/><path d="M11 17v5"/><path d="M9 19h4"/></svg></span>
            <span class="sb-label">Key Saya (BYOK)</span>
          </button>
          <button class="sb-item" data-view="dashboard-models">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
            <span class="sb-label">Models</span>
          </button>
          <button class="sb-item" data-view="dashboard-files">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>
            <span class="sb-label">Files</span>
          </button>
          <button class="sb-item" data-view="dashboard-billing">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="12" x2="12.01" y1="11" y2="11"/></svg></span>
            <span class="sb-label">Billing</span>
          </button>
          <button class="sb-item" data-view="dashboard-settings">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg></span>
            <span class="sb-label">Settings</span>
          </button>
        </div>

        <div id="adminSection" class="sb-group" style="display:none">
          <div class="sb-group-title">Admin</div>
          <button class="sb-item" data-view="admin-pool">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg></span>
            <span class="sb-label">API Pool</span>
          </button>
          <button class="sb-item" data-view="admin-health">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
            <span class="sb-label">Health Map</span>
          </button>
          <button class="sb-item" data-view="admin-users">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span class="sb-label">Users & Plans</span>
          </button>
          <button class="sb-item" data-view="admin-orders">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>
            <span class="sb-label">Orders</span>
          </button>
          <button class="sb-item" data-view="admin-flags">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg></span>
            <span class="sb-label">Feature Flags</span>
          </button>
          <button class="sb-item" data-view="admin-audit">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>
            <span class="sb-label">Audit Log</span>
          </button>
          <button class="sb-item" data-view="admin-announcements">
            <span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
            <span class="sb-label">Announcements</span>
          </button>
        </div>
      </div>

      <div class="sb-foot">
        <button class="sb-item" id="sbProfile">
          <span class="avatar" id="sbAvatar">?</span>
          <span class="sb-label" id="sbUserName">Guest</span>
        </button>
      </div>
    </aside>

    <div id="backdrop" aria-hidden="true"></div>

    <!-- ================= MAIN ================= -->
    <div class="main">
      <!-- TOP BAR -->
      <header class="topbar" role="banner">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>
          </svg>
        </button>

        <div style="position:relative; flex:1; display:flex; justify-content:center;">
          <div class="model-pill" id="modelPill" style="display:none;">
            <span class="status-dot" id="modelStatusDot"></span>
            <span id="modelPillName">Auto</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <button class="model-btn" id="modelBtn" aria-label="Pilih model" aria-expanded="false" aria-haspopup="listbox">
            <span id="modelName">Auto</span>
            <span class="caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </button>
          <div class="menu" id="modelMenu" role="listbox" aria-label="Pilih model" style="top:44px;left:0">
            <div class="menu-label">Model</div>
            <div class="menu-section" id="modelMenuFavorites"></div>
            <div class="menu-sep"></div>
            <div class="menu-label">Semua Model</div>
            <div class="menu-section" id="modelMenuAll"></div>
          </div>
        </div>

        <div class="spacer"></div>

        <div style="display:flex; align-items:center; gap:4px;">
          <button class="icon-btn only-desktop" id="shareBtn" aria-label="Bagikan" title="Bagikan" style="width:auto;padding:0 10px;gap:6px;font-size:14px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/>
            </svg>
            <span>Bagikan</span>
          </button>

          <button class="icon-btn only-mobile" id="newChatBtn" aria-label="Chat baru">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>
            </svg>
          </button>

          <button class="icon-btn" id="themeBtn" aria-label="Toggle tema">
            <span id="themeIcon"></span>
          </button>
        </div>
      </header>

      <!-- STAGE -->
      <div class="stage" id="stage">
        <!-- EMPTY STATE -->
        <section class="empty" id="emptyState" aria-label="Selamat datang">
          <div class="empty-inner">
            <h1 class="greeting" id="greeting">Mulai obrolan baru</h1>
            <div id="emptySlot" style="width:100%"></div>
            <div class="chips" id="promptChips"></div>
          </div>
        </section>

        <!-- CHAT VIEW -->
        <section class="chat" id="chatState" style="display:none" aria-label="Obrolan">
          <div class="scroller" id="scroller" role="log" aria-live="polite" aria-atomic="false">
            <div class="thread" id="thread"></div>
          </div>
          <div class="dock">
            <div class="dock-inner" style="position:relative">
              <button id="jump" aria-label="Gulir ke bawah" title="Gulir ke bawah">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
              </button>
              <div id="chatSlot"></div>
              <p class="disclaimer">Black Flow dapat membuat kesalahan. Periksa info penting.</p>
            </div>
          </div>
        </section>

        <!-- DASHBOARD VIEW -->
        <section class="chat" id="dashboardState" style="display:none" aria-label="Dashboard">
          <div class="scroller" id="dashboardScroller">
            <div class="thread" id="dashboardContent" style="max-width:100%; padding:0;"></div>
          </div>
        </section>

        <!-- ADMIN VIEW -->
        <section class="chat" id="adminState" style="display:none" aria-label="Admin">
          <div class="scroller" id="adminScroller">
            <div class="thread" id="adminContent" style="max-width:100%; padding:0;"></div>
          </div>
        </section>

        <!-- AUTH VIEW -->
        <section class="empty" id="authState" style="display:none" aria-label="Autentikasi">
          <div class="empty-inner">
            <div id="authSlot" style="width:100%; max-width:400px;"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Main App Module -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
